    <div class="filter-group">
        <label>Consultar relatórios por período e professor:</label>
        <div class="filter-controls">
            <input type="date" id="dataInicio" onchange="atualizarTela()" title="Data Inicial">
            <span class="separador-data">até</span>
            <input type="date" id="dataFim" onchange="atualizarTela()" title="Data Final">
            
            <input type="text" id="usuarioFiltro" list="listaProfessores" placeholder="Buscar professor..." oninput="atualizarTela()" title="Filtrar por professor/setor">
            
            <button onclick="limparFiltros()" class="btn-secundario">Limpar</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <h3 id="tituloDia">Total Hoje</h3>
            <p id="totalDia">0</p>
        </div>
        <div class="card">
            <h3 id="tituloMes">Total no Mês</h3>
            <p id="totalMes">0</p>
        </div>
    </div>

    <div id="alertaCota" class="info-cota">
        Cota restante de <span id="nomeCotaTexto"></span> neste mês: <span id="valorCotaTexto">0</span> folhas.
    </div>

    <div class="form-group form-lancamento">
        <input type="date" id="dataLancamento" title="Data do lançamento (Deixe vazio para Hoje)">
        
        <input type="text" id="nomeUsuario" list="listaProfessores" placeholder="Quem imprimiu? (Busque aqui)" oninput="verificarCota()">
        
        <input type="number" id="qtdImpressoes" placeholder="Qtd">
        <button onclick="registrarImpressao()">Lançar</button>
    </div>

    <div class="history">
        <div class="history-header">
            <h3 id="tituloHistorico">Lançamentos de Hoje</h3>
            <button onclick="apagarTudo()" class="btn-perigo" title="Apagar todos os registros">⚠️ Apagar Tudo</button>
        </div>
        <div id="listaRegistros"></div>
    </div>
</div>

<script src="script.js" defer></script>
